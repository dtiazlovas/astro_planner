# Render blueprint. Deploys the merged app as one web service.
#
# The disk is not optional: Render's filesystem is rebuilt on every deploy and
# restart, so without it the SQLite file is recreated empty each boot and the
# data silently disappears. A disk also pins the service to one instance, which
# is what we want — two instances writing one SQLite file corrupts it.
#
# NODE_ENV is deliberately unset: the server treats anything other than
# "development" as production, and setting NODE_ENV=production here would make
# `npm install` skip devDependencies, leaving vite/esbuild missing at build time.
services:
  - type: web
    name: astro-planner
    runtime: node
    # Disks require a paid instance type — they are not available on free.
    plan: starter
    # Pick the region nearest you: oregon | ohio | virginia | frankfurt | singapore
    region: frankfurt
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      # better-sqlite3 v11 ships prebuilt bindings per Node ABI; without a pin,
      # a newer default Node forces a slow source build (or fails).
      - key: NODE_VERSION
        value: "20"
      # Absolute, and on the mounted disk — not the ephemeral checkout.
      - key: SQLITE_PATH
        value: /var/data/astro_planner.db
    disk:
      name: astro-planner-data
      mountPath: /var/data
      sizeGB: 1
