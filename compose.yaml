# Development in a container: current Node, nothing installed on the host.
#
#   docker compose up                                  # http://localhost:5000
#   docker compose run --rm app npm run db:snapshot    # copy the DB to ./backups
#   docker compose build                               # after a dependency change
#
# The three volume entries below are not incidental — each one works around a
# specific way a naive bind mount breaks this app on Windows. See the comments.

# Without this, Compose names everything after the directory the file sits in —
# which is "repo". It prefixes the container, the built image, the network and
# every volume, so setting it here is what makes those names meaningful.
# Overridable per-invocation with `docker compose -p <name>` or
# COMPOSE_PROJECT_NAME, though there is no reason to.
name: astro-planner

services:
  # The service name is what commands address: `docker compose run --rm app …`,
  # `docker compose logs app`. Renaming it changes those; the names below are
  # only labels and can change freely.
  app:
    build:
      context: .
      target: dev
    # Tag for the image this service builds. Without it, Compose would generate
    # <project>-<service> — astro-planner-app.
    image: astro-planner:dev
    # Fixed name instead of the generated <project>-<service>-<index>, so
    # `docker logs`/`docker exec` have something predictable to address. It rules
    # out running more than one replica, which this app would not want anyway:
    # they would fight over one SQLite file.
    container_name: astro-planner
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      # Bind mounts on Windows drives do not deliver inotify events into the
      # container, so tsx and Vite would never see an edit and HMR would appear
      # to be broken. Polling is the only thing that crosses that boundary; it
      # costs CPU continuously, which is why it is opt-in rather than in the
      # Vite config unconditionally.
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      # Live source, so edits on the host reach the container.
      - .:/app
      # This mount replaces /app wholesale — including the node_modules the
      # image installed. A named volume puts a Linux-native one back on top:
      # the host's copy holds a Windows better-sqlite3 binding this container
      # cannot load, and with no volume here there would be no node_modules at
      # all.
      #
      # It is seeded from the image the first time and not refreshed after that,
      # so a dependency change needs it recreated:
      #   docker compose down && docker compose build
      #   docker volume rm astro-planner-node-modules && docker compose up
      # Never `docker compose down -v` for this — that removes every volume,
      # including the database in `data` below.
      - node_modules:/app/node_modules
      # SQLite stays on the VM's own filesystem rather than the Windows drive.
      # SQLite locks with fcntl byte ranges, and the bind-mount layer does not
      # provide those reliably — "database is locked" at best, a corrupted
      # database at worst. Half of the original reason is gone (WAL's
      # shared-memory file, which the database no longer uses since db.ts moved
      # to rollback-journal mode) but the locking half stands, and nobody has
      # tested a bind-mounted database since. The cost is that the file is not
      # visible in Explorer; `npm run db:snapshot` writes a copy out that is.
      - data:/app/data
      # Where that copy lands. A plain bind mount is fine here because nothing
      # holds a snapshot open — it is written once and closed.
      #
      # The app writes here too, not just the `backup` service below: a few
      # seconds after any request that changed something, it rewrites today's
      # snapshot (src/server/localBackup.ts). Both write the same file per day,
      # so this being read-write is what keeps the newest backup as fresh as the
      # last import rather than as fresh as 03:00.
      - ./backups:/backups

  # One snapshot a day into ./backups, pruned to the last week, plus one on
  # every start — `docker compose restart backup` forces one. Runs in the stack
  # rather than as a host cron/Task Scheduler entry so it needs no per-machine
  # setup: anyone who starts the stack gets backups.
  #
  # The floor rather than the whole of it. `app` rewrites the same day's file
  # after each burst of writes, which is what makes the newest snapshot as recent
  # as the last import; this covers a day nothing was written, a day the stack
  # was down at BACKUP_AT, and a day that path has silently stopped working.
  #
  # It reuses the image `app` builds — hence depends_on, which orders the build
  # as well as the start. No ports; it never serves anything.
  backup:
    image: astro-planner:dev
    container_name: astro-planner-backup
    depends_on:
      - app
    restart: unless-stopped
    command: ["node", "scripts/backup-daily.js"]
    environment:
      # Container-local time. The image is UTC unless TZ is set here.
      BACKUP_AT: "03:00"
      BACKUP_KEEP: "7"
      # TZ: Europe/Vilnius
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      # Read-write, not :ro — VACUUM INTO opens the source database, and SQLite
      # needs to be able to create a journal beside it to take even a read
      # transaction. It only ever reads: the snapshot goes to /backups.
      - data:/app/data
      - ./backups:/backups

# `name:` pins the real volume name. Without it these would be prefixed with the
# project name (astro-planner_data), which is fine but makes the name depend on
# a setting rather than saying what it is. Pinning also means renaming the
# project later cannot silently orphan the database.
volumes:
  node_modules:
    name: astro-planner-node-modules
  data:
    name: astro-planner-data
